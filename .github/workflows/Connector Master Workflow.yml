name: Connector Master Workflow

# Needed for OIDC, checkout, git-push, ...
permissions: write-all

on:
  workflow_call:
    outputs:
      quality_gate:
        description: "Results from Skyline Quality Gate."
        value: ${{ jobs.CI_SDK.outputs.quality_gate }}${{ jobs.CI_Legacy.outputs.quality_gate }}

    inputs:
      # No need to specify these as the workflow can access github.* (https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#github-context)
      # When a reusable workflow is triggered by a caller workflow, the github context is always associated with the caller workflow.
      referenceName:
        required: false
        type: string
      runNumber:
        required: false
        type: string
      referenceType:
        required: false
        type: string
      repository:
        required: false
        type: string
      owner:
        required: false
        type: string

      # Optional OIDC inputs in case outside SkylineCommunications organization
      oidc-client-id:
        required: false
        type: string
      oidc-tenant-id:
        required: false
        type: string
      oidc-subscription-id:
        required: false
        type: string

      sonarCloudProjectName:
        required: false
        type: string
      debug:
        required: false
        type: boolean

      # Name of the solution file (.sln or .slnx) to build when the repository
      # contains more than one. Only supported for SDK-style connectors.
      solution-filter-name:
        required: false
        type: string

    secrets:
      api-key:
        required: false
      sonarCloudToken:
        required: false
      azureToken:
        required: false
      SKYLINE_USERNAME:
        required: false
      SKYLINE_PASSWORD:
        required: false

jobs:

  validate_trigger:
    name: Validate Trigger
    runs-on: ubuntu-latest
    steps:
      - uses: SkylineCommunications/_ReusableWorkflows/.github/actions/guard-trigger@main

  check_deprecated_item:
    name: Check deprecated items
    needs: [validate_trigger]
    runs-on: ubuntu-latest
    steps:
      - name: Check if obsolete inputs are still used
        run: |
          input_names=("referenceName" "runNumber" "referenceType" "repository" "owner")

          for input_name in "${input_names[@]}"; do
            value="${{ inputs.referenceName }}"  # placeholder, see note below
            case $input_name in
              referenceName) value="${{ inputs.referenceName }}" ;;
              runNumber) value="${{ inputs.runNumber }}" ;;
              referenceType) value="${{ inputs.referenceType }}" ;;
              repository) value="${{ inputs.repository }}" ;;
              owner) value="${{ inputs.owner }}" ;;
            esac

            if [ -n "$value" ]; then
              echo "::warning::The input '$input_name' can be safely removed as this is not required anymore."
            fi
          done

      - name: Check if obsolete secrets are still used
        if: github.repository_owner == 'SkylineCommunications'
        run: |
          secret_names=("azureToken" "sonarCloudToken")

          for secret_name in "${secret_names[@]}"; do
            value="${{ secrets.sonarCloudToken }}"  # placeholder, see note below
            case $secret_name in
              sonarCloudToken) value="${{ secrets.sonarCloudToken }}" ;;
              azureToken) value="${{ secrets.azureToken }}" ;;
            esac

            if [ -n "$value" ]; then
              echo "::warning::The secret '$secret_name' can be safely removed as this is not required anymore."
            fi
          done

  check_oidc:
    name: Check OIDC
    runs-on: ubuntu-latest
    outputs:
      client-id: ${{ steps.resolve.outputs.client-id }}
      tenant-id: ${{ steps.resolve.outputs.tenant-id }}
      subscription-id: ${{ steps.resolve.outputs.subscription-id }}
      use-oidc: ${{ steps.resolve.outputs.use-oidc }}
      is-skyline-managed: ${{ steps.resolve.outputs.is-skyline-managed }}
    steps:
      - id: resolve
        uses: SkylineCommunications/_ReusableWorkflows/.github/actions/resolve-oidc@main
        with:
          client-id: ${{ inputs.oidc-client-id }}
          tenant-id: ${{ inputs.oidc-tenant-id }}
          subscription-id: ${{ inputs.oidc-subscription-id }}
          repository-owner: ${{ github.repository_owner }}

  check_solution_type:
      name: Check Project Types
      runs-on: ubuntu-latest
      outputs:
        isSdk: ${{ steps.checker.outputs.isSdk }}

      steps:
        - name: Enable long paths
          run: git config --global core.longpaths true

        - uses: actions/checkout@v7

        - name: Install SDKChecker
          run: dotnet tool install Skyline.DataMiner.CICD.Tools.SDKChecker --global --version 2.*

        - name: Find solution file
          id: find-solution
          if: inputs.solution-filter-name != ''
          env:
            SOLUTION_FILTER_NAME: ${{ inputs.solution-filter-name }}
          run: |
            results=$(find . -type f -name "$SOLUTION_FILTER_NAME" \( -name '*.sln' -o -name '*.slnx' \))

            count=$(echo "$results" | grep -c .)
            if [ "$count" -eq 0 ]; then
              echo "Error: No .sln or .slnx file matching '$SOLUTION_FILTER_NAME' found. Note: .slnf filters are not supported for connectors."
              exit 1
            elif [ "$count" -gt 1 ]; then
              echo "Error: Multiple solution files match '$SOLUTION_FILTER_NAME':"
              echo "$results"
              exit 1
            fi

            echo "path=$results" >> "$GITHUB_OUTPUT"
          shell: bash

        - name: Run SDKChecker
          id: checker
          env:
            WORKSPACE: ${{ github.workspace }}
            REPOSITORY_URL: ${{ github.repositoryUrl }}
            REF_NAME: ${{ github.ref_name }}
            SOLUTION_FILEPATH: ${{ steps.find-solution.outputs.path }}
          run: |
            if [ -n "$SOLUTION_FILEPATH" ]; then
              output="$(SDKChecker --workspace "$WORKSPACE" --repositoryName "$REPOSITORY_URL" --repositoryBranch "$REF_NAME" --solution-filepath "$SOLUTION_FILEPATH")"
            else
              output="$(SDKChecker --workspace "$WORKSPACE" --repositoryName "$REPOSITORY_URL" --repositoryBranch "$REF_NAME")"
            fi
            if [ -z "$output" ]; then
              echo "isSdk=true" >> "$GITHUB_OUTPUT"
            else
              echo "isSdk=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Output: $output"

        # The legacy pipeline is repo-root-bound and cannot honor a solution filter.
        - name: Reject solution filter for legacy connectors
          if: inputs.solution-filter-name != '' && steps.checker.outputs.isSdk == 'false'
          run: |
            echo "::error::solution-filter-name is only supported for SDK-style connectors; this repository resolved to the legacy pipeline."
            exit 1

  CI_Legacy:
    uses: ./.github/workflows/Connector Master Legacy Workflow.yml
    needs: [check_solution_type, check_oidc]
    if: needs.check_solution_type.outputs.isSdk == 'false'
    with:
      oidc-client-id: ${{ needs.check_oidc.outputs.client-id }}
      oidc-tenant-id: ${{ needs.check_oidc.outputs.tenant-id }}
      oidc-subscription-id: ${{ needs.check_oidc.outputs.subscription-id }}
      use-oidc: ${{ needs.check_oidc.outputs.use-oidc }}

      sonarCloudProjectName: ${{ inputs.sonarCloudProjectName }}
      debug: ${{ inputs.debug }}
    secrets: inherit

  CI_SDK:
    uses: ./.github/workflows/Connector Master SDK Workflow.yml
    needs: [check_solution_type, check_oidc]
    if: needs.check_solution_type.outputs.isSdk == 'true'
    with:
      oidc-client-id: ${{ needs.check_oidc.outputs.client-id }}
      oidc-tenant-id: ${{ needs.check_oidc.outputs.tenant-id }}
      oidc-subscription-id: ${{ needs.check_oidc.outputs.subscription-id }}
      use-oidc: ${{ needs.check_oidc.outputs.use-oidc }}

      sonarCloudProjectName: ${{ inputs.sonarCloudProjectName }}
      debug: ${{ inputs.debug }}
      solution-filter-name: ${{ inputs.solution-filter-name }}
    secrets: inherit

  update_collaboration_tasks:
    name: Update Collaboration Tasks
    # Both route jobs are listed deliberately. The always()-safe condition below
    # checks only the route selected by check_solution_type, so the skipped route
    # cannot suppress a successful stable release.
    needs: [validate_trigger, check_oidc, check_solution_type, CI_SDK, CI_Legacy]
    if: >-
      always() &&
      needs.validate_trigger.result == 'success' &&
      needs.check_oidc.result == 'success' &&
      needs.check_solution_type.result == 'success' &&
      github.ref_type == 'tag' &&
      !contains(github.ref_name, '-') &&
      (
        (needs.check_solution_type.outputs.isSdk == 'true' && needs.CI_SDK.result == 'success') ||
        (needs.check_solution_type.outputs.isSdk == 'false' && needs.CI_Legacy.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Enable long paths
        continue-on-error: true
        run: git config --global core.longpaths true
        shell: bash

      - name: Azure Login for optional Key Vault credentials
        if: needs.check_oidc.outputs.use-oidc == 'true'
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ needs.check_oidc.outputs.client-id }}
          tenant-id: ${{ needs.check_oidc.outputs.tenant-id }}
          subscription-id: ${{ needs.check_oidc.outputs.subscription-id }}

      - name: Load optional Skyline API credentials
        if: needs.check_oidc.outputs.use-oidc == 'true'
        continue-on-error: true
        uses: SkylineCommunications/_ReusableWorkflows/.github/actions/load-secrets@main
        with:
          use-oidc: ${{ needs.check_oidc.outputs.use-oidc }}
          secret-names: |
            skyline-username
            skyline-password

      - name: Checkout released connector tag
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Update Collaboration task comments
        id: update_comments
        if: always()
        continue-on-error: true
        uses: SkylineCommunications/_ReusableWorkflows/.github/actions/connector-release-task-comment@main
        with:
          release-tag: ${{ github.ref_name }}
          quality-gates-passed: ${{ (needs.check_solution_type.outputs.isSdk == 'true' && needs.CI_SDK.result == 'success') || (needs.check_solution_type.outputs.isSdk == 'false' && needs.CI_Legacy.result == 'success') }}
        env:
          SKYLINE_USERNAME_OVERRIDE: ${{ secrets.SKYLINE_USERNAME }}
          SKYLINE_PASSWORD_OVERRIDE: ${{ secrets.SKYLINE_PASSWORD }}

      - name: Report non-blocking Collaboration result
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.update_comments.outcome }}
          ACTION_STATUS: ${{ steps.update_comments.outputs.status }}
        run: |
          if [[ "$ACTION_OUTCOME" != "success" || "$ACTION_STATUS" != "success" ]]; then
            echo "::warning::Connector release succeeded, but Collaboration task comments were not fully updated. See the action error and Job Summary for details."
          else
            echo "Collaboration task comments were updated successfully."
          fi
        shell: bash

  # Keep the enterprise custom property `Workflow-Repo-Type` in sync: a connector repo is always
  # `Connector`. Runs only on the repository's default branch (feature branches / PRs / tags never
  # flip the governance type) and only for Skyline-managed repos where OIDC (and thus the Key Vault
  # token) is available. The write identity is the org-owner classic PAT `reusable-workflows-token`;
  # the default GITHUB_TOKEN cannot write it.
  set_repo_type:
    name: Set Repo Type
    needs: [check_oidc]
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      needs.check_oidc.outputs.is-skyline-managed == 'true' &&
      needs.check_oidc.outputs.use-oidc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ needs.check_oidc.outputs.client-id }}
          tenant-id: ${{ needs.check_oidc.outputs.tenant-id }}
          subscription-id: ${{ needs.check_oidc.outputs.subscription-id }}

      - name: Load secrets
        uses: SkylineCommunications/_ReusableWorkflows/.github/actions/load-secrets@main
        with:
          use-oidc: ${{ needs.check_oidc.outputs.use-oidc }}
          secret-names: |
            reusable-workflows-token

      - name: Set repo type
        uses: SkylineCommunications/_ReusableWorkflows/.github/actions/set-repo-type@main
        with:
          repo-types: Connector
          token: ${{ env.REUSABLE_WORKFLOWS_TOKEN }}
