name: Sign assemblies
description: >
  Preserves valid Windows-trusted embedded Authenticode signatures, then signs
  remaining unique build output contents through Azure Key Vault and copies
  the signed result over their byte-identical duplicates. Verification errors
  and invalid signature metadata fail before signing or copying.

inputs:
  root:
    description: Root directory to scan for build outputs. Defaults to the current directory.
    required: false
    default: '.'
  extensions:
    description: Comma-separated list of file extensions to sign, without a leading dot.
    required: false
    default: 'dll,exe'
  path-segment:
    description: Directory segment a file must live under to be treated as a build output.
    required: false
    default: 'bin'
  publisher-name:
    description: Publisher name embedded in the signature.
    required: false
    default: 'Skyline Communications'
  description:
    description: Description embedded in the signature.
    required: false
    default: 'Skyline Signing'
  description-url:
    description: Description URL embedded in the signature.
    required: false
    default: 'https://www.skyline.be/'
  dry-run:
    description: When 'true', verify signatures and report planned counts without changing files or calling the Sign CLI.
    required: false
    default: 'false'

outputs:
  files-total:
    description: Number of build output files that matched the scan.
    value: ${{ steps.sign.outputs.files-total }}
  files-signed:
    description: Number of remaining unique file contents submitted for signing, or planned in dry-run.
    value: ${{ steps.sign.outputs.files-signed }}
  files-copied:
    description: Number of remaining duplicate paths copied from signed representatives, or planned in dry-run.
    value: ${{ steps.sign.outputs.files-copied }}
  files-skipped:
    description: Number of matched paths preserved because their embedded Authenticode signature is valid and Windows-trusted.
    value: ${{ steps.sign.outputs.files-skipped }}
  batches:
    description: Number of Sign CLI invocations used for remaining contents, or planned in dry-run.
    value: ${{ steps.sign.outputs.batches }}

runs:
  using: composite
  steps:
    - name: Sign assemblies
      id: sign
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        SIGN_ROOT: ${{ inputs.root }}
        SIGN_EXTENSIONS: ${{ inputs.extensions }}
        SIGN_PATH_SEGMENT: ${{ inputs.path-segment }}
        SIGN_PUBLISHER_NAME: ${{ inputs.publisher-name }}
        SIGN_DESCRIPTION: ${{ inputs.description }}
        SIGN_DESCRIPTION_URL: ${{ inputs.description-url }}
        SIGN_DRY_RUN: ${{ inputs.dry-run }}
      run: '& (Join-Path $env:ACTION_PATH "sign-assemblies.ps1")'
