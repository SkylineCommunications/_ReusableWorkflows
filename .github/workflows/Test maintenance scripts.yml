name: Test maintenance scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/actions/update-global-json-sdks/action.yml'
      - '.github/actions/update-global-json-sdks/update-global-json-sdks.ps1'
      - '.github/workflows/Connector Master SDK Workflow.yml'
      - '.github/workflows/Master Workflow.yml'
      - '.github/workflows/Test composite actions.yml'
      - '.github/workflows/Test Downstream.yml'
      - '.github/workflows/Create Prerelease Workflow.yml'
      - '.github/workflows/Test maintenance scripts.yml'
      - '.github/workflows/Update managed dependency versions.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/actions/update-global-json-sdks/action.yml'
      - '.github/actions/update-global-json-sdks/update-global-json-sdks.ps1'
      - '.github/workflows/Connector Master SDK Workflow.yml'
      - '.github/workflows/Master Workflow.yml'
      - '.github/workflows/Test composite actions.yml'
      - '.github/workflows/Test Downstream.yml'
      - '.github/workflows/Create Prerelease Workflow.yml'
      - '.github/workflows/Test maintenance scripts.yml'
      - '.github/workflows/Update managed dependency versions.yml'

permissions:
  contents: read

jobs:
  test-prepare-downstream-fixes:
    name: Test prepare-downstream-fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install workflow test dependencies
        shell: bash
        run: python -m pip install PyYAML==6.0.3

      - name: Check connector gate test tools
        shell: bash
        run: |
          command -v pwsh
          command -v jq

      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'