name: Test maintenance scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/actions/update-global-json-sdks/action.yml'
      - '.github/actions/update-global-json-sdks/update-global-json-sdks.ps1'
      - '.github/workflows/Master Workflow.yml'
      - '.github/workflows/Test composite actions.yml'
      - '.github/workflows/Test Downstream.yml'
      - '.github/workflows/Test maintenance scripts.yml'
      - '.github/workflows/Update managed dependency versions.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/actions/update-global-json-sdks/action.yml'
      - '.github/actions/update-global-json-sdks/update-global-json-sdks.ps1'
      - '.github/workflows/Master Workflow.yml'
      - '.github/workflows/Test composite actions.yml'
      - '.github/workflows/Test Downstream.yml'
      - '.github/workflows/Test maintenance scripts.yml'
      - '.github/workflows/Update managed dependency versions.yml'

permissions:
  contents: read

jobs:
  test-prepare-downstream-fixes:
    name: Test prepare-downstream-fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run unit tests
        shell: bash
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'